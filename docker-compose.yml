# MVP para notebook Windows (Docker Desktop) — CPU, sem NVIDIA.
# GPU é opcional: docker compose -f docker-compose.yml -f docker-compose.gpu.yml up
name: ipeia-academico

services:
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    # Só localhost: o Ollama não tem autenticação; exposto na rede, qualquer
    # máquina da LAN usaria seu modelo e sua CPU/GPU.
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s

  web:
    build: .
    restart: unless-stopped
    depends_on:
      ollama:
        condition: service_healthy
    ports:
      - "127.0.0.1:8501:8501"
    environment:
      # Troca de motor de IA: defina LLM_PROVIDER/LLM_MODEL (e a chave) no .env.
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      LLM_MODEL: ${LLM_MODEL:-qwen3.5:4b}
      LLM_API_BASE: ${LLM_API_BASE:-http://ollama:11434}
      SUMMARY_LLM_MODEL: ${SUMMARY_LLM_MODEL:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-st-multi-qa-MiniLM-L6-cos-v1}
      PDF_DIR: /app/documentos
      PQA_HOME: /app/.pqa
      CONTACT_EMAIL: ${CONTACT_EMAIL:-}
      ANSWER_LANGUAGE: ${ANSWER_LANGUAGE:-português do Brasil}
    volumes:
      - pdfs:/app/documentos
      - pqa_index:/app/.pqa
      - hf_cache:/app/.cache/hf

volumes:
  ollama_models:
  pdfs:
  pqa_index:
  hf_cache:
